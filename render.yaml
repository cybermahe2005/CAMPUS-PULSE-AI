services:
  - type: web
    name: campus-pulse-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: APP_NAME
        value: CampusPulseAI
      - key: APP_VERSION
        value: 1.0.0
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: DB_NAME
        value: campus_pulse
      - key: MODEL_DIR
        value: ./models
      - key: DATA_DIR
        value: ./datasets
      - key: SEED
        value: "42"
      - key: CORS_ORIGINS
        value: "https://campus-pulse-ai-orpin.vercel.app,http://localhost:3000"
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_URL
        sync: false